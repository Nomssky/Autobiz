# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# found on PyPI
#timezone =

# max length of characters to apply to the
# "slug" field
#slug_length = 40

# version location specification; this defaults
# to alembic/version.  Multiple locations can be given
# as a comma-separated list (spaces are OK).
version_path = %(version_loc)s
version_loc = %(here)s/%(version_dir)s
version_dir = versions

# the output encoding used when revision files
# are written from script_location
#output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
#format = %(levelname)-5.5s [%(name)s] %(asctime)s %(message)s