<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Detail — {{AGENT_NAME}}</title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🏢 AutoBiz</div>
    <div class="header-right">
      <span class="model-badge" id="model-badge">—</span>
    </div>
  </header>

  <div class="back-bar">
    <a href="/ui/dashboard" class="back-link">← Kembali</a>
    <span class="page-title" id="page-title">⚙️ Agent Detail</span>
  </div>

  <div class="detail-card">
    <div class="detail-header">
      <span class="agent-emoji large" id="detail-emoji">🤖</span>
      <div>
        <div class="detail-name" id="detail-name">—</div>
        <div class="detail-desc" id="detail-desc">—</div>
      </div>
      <div class="detail-status-badge" id="detail-status">—</div>
    </div>

    <div class="detail-section">
      <div class="detail-row"><span class="detail-label">Min Tier</span><span class="detail-value" id="detail-min-tier">—</span></div>
      <div class="detail-row"><span class="detail-label">Current Tier</span><span class="detail-value" id="detail-cur-tier">—</span></div>
      <div class="detail-row" id="detail-warn-row">
        <span class="detail-label">⚠ Warning</span>
        <span class="detail-value warn-text" id="detail-warning">—</span>
      </div>
    </div>

    <div class="detail-section">
      <div class="form-row">
        <label>Enabled</label>
        <label class="switch">
          <input type="checkbox" id="chk-enabled" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="form-row">
        <label>Model Override</label>
        <input type="text" id="input-model" placeholder="llama3:70b" class="form-input">
      </div>
      <div class="form-row">
        <label>Temperature</label>
        <input type="number" id="input-temp" step="0.1" min="0" max="2" value="0.7" class="form-input short">
      </div>
      <button class="btn" onclick="saveConfig()">💾 Simpan</button>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div class="nav-bar">
    <span class="nav-key active">← Back to Dashboard</span>
  </div>
</div>
<script src="/ui/static/app.js"></script>
<script>loadDetail('{{AGENT_NAME}}')</script>
</body>
</html>
