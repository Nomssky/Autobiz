name: CI — Test & Lint

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "tests/**"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run linter (syntax check)
        working-directory: backend
        run: |
          python -c "
          import ast, glob, sys
          errors = []
          for f in glob.glob('app/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True):
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All files pass syntax check')
          "

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_db
          DEBUG: "true"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-12345' }}
        run: |
          python -m pytest tests/ -x -v --tb=short 2>&1