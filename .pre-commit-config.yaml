# Pre-commit hooks for AutoBiz Engine
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black, --line-length, "100"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--ignore=E402,E501,E203,W291,W503,S101,S104,S105,S108,S110,S311,S324,S404,S603,S607,B007,B008"]
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-bandit

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: check-yaml
        name: Check YAML syntax
        entry: python -c "import sys,yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: python
        additional_dependencies: [pyyaml]
        files: \.ya?ml$

      - id: check-json
        name: Check JSON syntax
        entry: python -c "import json, sys; json.load(open(sys.argv[1]))"
        language: python
        files: \.json$

      - id: check-toml
        name: Check TOML syntax
        entry: python -c "import tomllib; tomllib.load(open(sys.argv[1], 'rb'))"
        language: python
        files: \.toml$

      - id: check-docstrings
        name: Check docstrings exist
        entry: >
          python -c "import ast, sys; import sys; [print(f'WARNING: {f}:{node.lineno} - {node.name} missing docstring') for f in sys.argv[1:] for tree in [ast.parse(open(f).read())] for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and not ast.get_docstring(node)]"
        language: python
        files: \.py$
        pass_filenames: true