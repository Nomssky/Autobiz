# Pre-commit hooks for AutoBiz Engine
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black, --line-length, 100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=100, --ignore=E501,W503]
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-bandit

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --strict-optional]
        additional_dependencies:
          - types-all

  - repo: https://github.com/astral-sh/ruff
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: check-yaml
        name: Check YAML syntax
        entry: python -c "import yaml; yaml.safe_load(open('configs/deploy.yaml'))"
        language: python
        files: \.ya?ml$

      - id: check-json
        name: Check JSON syntax
        entry: python -c "import json, sys; json.load(open(sys.argv[1]))"
        language: python
        files: \.json$

      - id: check-toml
        name: Check TOML syntax
        entry: python -c "import tomllib; tomllib.load(open(sys.argv[1], 'rb'))"
        language: python
        files: \.toml$

      - id: no-secrets
        name: No secrets in code
        entry: detect-secrets scan --exclude-files '\.git/'
        language: system
        files: \.(py|ts|tsx|js|jsx|json|yaml|yml|toml|env)$

      - id: check-docstrings
        name: Check docstrings exist
        entry: python -c "
import ast, sys
for f in sys.argv[1:]:
    with open(f) as fh:
        tree = ast.parse(fh.read())
    for node in ast.walk(tree):
        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
            if not ast.get_docstring(node):
                print(f'WARNING: {f}:{node.lineno} - {node.name} missing docstring')
"
        language: python
        files: \.py$
        pass_filenames: true