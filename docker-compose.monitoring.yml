version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: autobiz-prometheus
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - autobiz_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: autobiz-grafana
    volumes:
      - ./infra/monitoring/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    networks:
      - autobiz_network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  autobiz_network:
    external: true

volumes:
  prometheus_data:
  grafana_data:
