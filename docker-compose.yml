services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autobiz_engine
      POSTGRES_USER: ${DB_USER:-autobiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autobiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-autobiz}:${DB_PASSWORD:-secret}@db:5432/autobiz_engine
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      target: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-autobiz}:${DB_PASSWORD:-secret}@db:5432/autobiz_engine
      REDIS_URL: redis://redis:6379
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

volumes:
  pgdata: